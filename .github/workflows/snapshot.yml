name: Deribit hourly snapshot

on:
  schedule:
    - cron: "35 * * * *"   # UTC; the script then waits until the next top-of-hour
  workflow_dispatch:        # manual run (for testing)

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait for top of hour and fetch
        run: python snapshot.py
      - name: Commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
