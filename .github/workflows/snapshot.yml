name: Deribit hourly snapshot

on:
  schedule:
    - cron: "5 * * * *"    # UTC. GitHub often starts 30-60 min late; the script backfills the
    - cron: "35 * * * *"   #   hour already begun (flagged late) and then waits for the next top of hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch snapshots
        run: python snapshot.py
      - name: Commit
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
